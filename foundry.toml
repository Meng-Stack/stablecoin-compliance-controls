[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
fs_permissions = [
  { access = "read-write", path = "./results" },
  { access = "read", path = "./data" },
]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
